<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f2">
  <meta name="description" content="Explore the fountains and keep track of the ones you've found.">
  <title>Fontaines · Fountain finder</title>
  <link rel="icon" href="location.ico">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #20342d;
      --muted: #687a70;
      --paper: #f5f7f2;
      --card: #ffffff;
      --line: #e2e9e1;
      --green: #25845a;
      --green-soft: #e3f3e9;
      --red: #d86b58;
      --shadow: 0 8px 28px rgba(31, 55, 43, .10);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      overflow: hidden;
    }
    #map { position: absolute; inset: 0; z-index: 1; background: #e9eee8; }
    .leaflet-container { font: inherit; }
    .panel {
      position: absolute;
      z-index: 500;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: min(310px, calc(100vw - 32px));
      padding: 18px;
      border: 1px solid rgba(226,233,225,.9);
      border-radius: 20px;
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 23px; line-height: 1.15; letter-spacing: -.04em; }
    .subtitle { margin: 6px 0 16px; color: var(--muted); font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat {
      min-width: 0;
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fbfcfa;
      text-align: center;
    }
    .stat strong { display: block; font-size: 23px; line-height: 1.15; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .stat.found strong { color: var(--green); }
    .progress-head { display: flex; justify-content: space-between; gap: 12px; margin: 17px 0 7px; font-size: 12px; font-weight: 700; }
    #progress-label { color: var(--muted); font-weight: 600; }
    .progress-track { height: 9px; overflow: hidden; border-radius: 99px; background: #edf1eb; }
    #progress-fill { width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #42a66e, #218255); transition: width .25s ease; }
    .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 15px; color: var(--muted); font-size: 11px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
    .dot.todo { background: var(--red); }
    .dot.done { background: var(--green); }
    .actions { display: flex; gap: 8px; margin-top: 17px; }
    button {
      min-height: 40px; padding: 0 13px; border: 1px solid var(--line);
      border-radius: 11px; background: #fff; color: var(--ink);
      font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }
    button:active { transform: scale(.97); }
    button.primary { flex: 1; border-color: var(--green); background: var(--green); color: white; }
    button:focus-visible { outline: 3px solid rgba(37,132,90,.25); outline-offset: 2px; }
    .status { min-height: 16px; margin: 11px 0 0; color: var(--muted); font-size: 11px; }
    .map-credit {
      position: absolute; z-index: 450; left: 12px; bottom: max(12px, env(safe-area-inset-bottom));
      padding: 6px 9px; border-radius: 9px; background: rgba(255,255,255,.9);
      color: #52645a; font-size: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    @media (max-width: 600px) {
      .panel {
        top: max(10px, env(safe-area-inset-top)); right: 10px; left: 10px;
        width: auto; padding: 14px 15px; border-radius: 17px;
      }
      h1 { font-size: 20px; }
      .subtitle { margin: 4px 0 12px; font-size: 12px; }
      .stat { padding: 8px 5px; }
      .stat strong { font-size: 20px; }
      .progress-head { margin-top: 12px; }
      .legend { margin-top: 11px; }
      .actions { margin-top: 12px; }
      button { min-height: 38px; }
      .map-credit { bottom: max(10px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Map showing fountains to discover"></div>

  <section class="panel" aria-label="Discovery progress">
    <p class="eyebrow">Explore nearby</p>
    <h1>Fontaines</h1>
    <p class="subtitle">Find the fountains and tap each marker when you've discovered it.</p>

    <div class="stats" aria-live="polite">
      <div class="stat"><strong id="total">—</strong><span>Total</span></div>
      <div class="stat found"><strong id="found">—</strong><span>Found</span></div>
      <div class="stat"><strong id="tofind">—</strong><span>Remaining</span></div>
    </div>

    <div class="progress-head">
      <span>Discovery progress</span>
      <span id="progress-label">0%</span>
    </div>
    <div class="progress-track" role="progressbar" aria-label="Fountains found" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0" id="progress">
      <div id="progress-fill"></div>
    </div>

    <div class="legend">
      <span class="legend-item"><i class="dot todo"></i>To find</span>
      <span class="legend-item"><i class="dot done"></i>Found</span>
    </div>
    <div class="actions">
      <button class="primary" id="locate-button" type="button">◎ My location</button>
      <button id="reset-button" type="button">Reset</button>
    </div>
    <p class="status" id="status" role="status">Loading fountain locations…</p>
  </section>

  <div class="map-credit">Map data © OpenStreetMap contributors</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { zoomControl: false }).setView([42.640356, 2.522745], 15);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const locationIcon = new L.Icon({
      iconUrl: 'location.ico', iconSize: [22, 22], iconAnchor: [11, 11]
    });
    const foundIcon = new L.Icon({
      iconUrl: 'fountaingreen.png', iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -26]
    });
    const todoIcon = new L.Icon({
      iconUrl: 'fountainred.png', iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -26]
    });

    const storageKey = 'markerStates';
    let markerStates = {};
    try { markerStates = JSON.parse(localStorage.getItem(storageKey) || '{}') || {}; }
    catch (error) { markerStates = {}; }

    let userMarker = null;
    let watchId = null;
    let fountainCount = 0;
    let foundCount = 0;
    const markers = [];
    const group = L.layerGroup().addTo(map);

    const totalEl = document.getElementById('total');
    const foundEl = document.getElementById('found');
    const remainingEl = document.getElementById('tofind');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progress-fill');
    const progressLabel = document.getElementById('progress-label');
    const statusEl = document.getElementById('status');

    function updateProgress() {
      const remaining = fountainCount - foundCount;
      const percent = fountainCount ? Math.round(foundCount / fountainCount * 100) : 0;
      totalEl.textContent = fountainCount;
      foundEl.textContent = foundCount;
      remainingEl.textContent = remaining;
      progressFill.style.width = percent + '%';
      progressLabel.textContent = percent + '%';
      progress.setAttribute('aria-valuemax', fountainCount);
      progress.setAttribute('aria-valuenow', foundCount);
      statusEl.textContent = remaining === 0 && fountainCount
        ? 'Wonderful — every fountain found!'
        : foundCount ? 'Your discoveries are saved on this device.' : 'Tap a fountain marker when you find it.';
    }

    function saveStates() {
      try { localStorage.setItem(storageKey, JSON.stringify(markerStates)); }
      catch (error) { statusEl.textContent = 'Unable to save progress on this device.'; }
    }

    function toggleMarker(marker, index, location) {
      marker.isFound = !marker.isFound;
      marker.setIcon(marker.isFound ? foundIcon : todoIcon);
      markerStates[index] = marker.isFound;
      foundCount += marker.isFound ? 1 : -1;
      saveStates();
      updateProgress();
      marker.setPopupContent('<strong>' + escapeHtml(location.Name || 'Fountain') + '</strong><br>' +
        (marker.isFound ? 'Marked as found ✓' : 'Still to find') +
        '<br><small>Tap marker to change status</small>');
      marker.openPopup();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    fetch('fontaines.json')
      .then(response => {
        if (!response.ok) throw new Error('Could not load fountain locations (' + response.status + ').');
        return response.json();
      })
      .then(locations => {
        fountainCount = locations.length;
        locations.forEach((location, index) => {
          const isFound = markerStates[index] === true;
          if (isFound) foundCount++;
          const marker = L.marker([location.Lat, location.Lon], {
            icon: isFound ? foundIcon : todoIcon,
            title: location.Name || 'Fountain',
            alt: location.Name || 'Fountain'
          });
          marker.isFound = isFound;
          marker.bindPopup('<strong>' + escapeHtml(location.Name || 'Fountain') + '</strong><br>' +
            (isFound ? 'Marked as found ✓' : 'Still to find') +
            '<br><small>Tap marker to change status</small>');
          marker.on('click', () => toggleMarker(marker, index, location));
          markers.push(marker);
          group.addLayer(marker);
        });
        updateProgress();
        if (markers.length) {
          const bounds = group.getBounds();
          map.fitBounds(bounds, { paddingTopLeft: [25, 210], paddingBottomRight: [25, 35], maxZoom: 16 });
        }
      })
      .catch(error => {
        console.error('Failed to load locations:', error);
        statusEl.textContent = 'Could not load the fountains. Check your connection and reload.';
      });

    function locateUser() {
      if (!('geolocation' in navigator)) {
        statusEl.textContent = 'Location is not available in this browser.';
        return;
      }
      statusEl.textContent = 'Finding your location…';
      navigator.geolocation.getCurrentPosition(position => {
        const point = [position.coords.latitude, position.coords.longitude];
        if (!userMarker) userMarker = L.marker(point, { icon: locationIcon, title: 'Your location' }).addTo(map);
        else userMarker.setLatLng(point);
        map.setView(point, Math.max(map.getZoom(), 16), { animate: true });
        statusEl.textContent = 'Your location is shown on the map.';
      }, error => {
        const messages = {
          1: 'Location permission was denied. You can enable it in browser settings.',
          2: 'Your location could not be determined.',
          3: 'Location request timed out. Please try again.'
        };
        statusEl.textContent = messages[error.code] || 'Unable to get your location.';
      }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 10000 });
    }

    document.getElementById('locate-button').addEventListener('click', locateUser);
    document.getElementById('reset-button').addEventListener('click', () => {
      if (!confirm('Reset all fountain discoveries on this device?')) return;
      markerStates = {};
      foundCount = 0;
      markers.forEach(marker => {
        marker.isFound = false;
        marker.setIcon(todoIcon);
        marker.setPopupContent('Still to find');
        marker.closePopup();
      });
      saveStates();
      updateProgress();
    });
  </script>
</body>
</html>
